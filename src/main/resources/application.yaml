spring:
  application:
    name: clinica-veterinaria

  datasource:
    url: jdbc:mysql://localhost:3306/clinica_vet_db?createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
      hibernate:
        ddl-auto: validate
      show-sql: true
      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.MySQLDialect

      flyway:
        enabled: true